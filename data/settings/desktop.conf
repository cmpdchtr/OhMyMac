# OhMyMac — core GNOME settings. Format: schema key value (GVariant).
# @PLACEHOLDERS@ are filled in by install.sh.

# Appearance
org.gnome.desktop.interface gtk-theme '@GTK_THEME@'
org.gnome.desktop.interface color-scheme '@COLOR_SCHEME@'
org.gnome.desktop.interface accent-color '@ACCENT@'
org.gnome.shell.extensions.user-theme name '@GTK_THEME@'

# Window management: traffic lights on the left, centred new windows
org.gnome.desktop.wm.preferences button-layout 'close,minimize,maximize:'
org.gnome.desktop.wm.preferences action-double-click-titlebar 'toggle-maximize'
org.gnome.mutter center-new-windows true
org.gnome.mutter attach-modal-dialogs true

# Menu bar clock: "Tue 27 Oct 14:05"
org.gnome.desktop.interface clock-show-weekday true
org.gnome.desktop.interface clock-show-date true
org.gnome.desktop.interface enable-hot-corners false

# Trackpad like a Mac
org.gnome.desktop.peripherals.touchpad natural-scroll true
org.gnome.desktop.peripherals.touchpad tap-to-click true
org.gnome.desktop.peripherals.touchpad two-finger-scrolling-enabled true

# Files
org.gnome.nautilus.preferences default-folder-viewer 'icon-view'
org.gtk.gtk4.Settings.FileChooser sort-directories-first true
