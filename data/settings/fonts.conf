# OhMyMac — typography (SF Pro if present, otherwise Inter).
org.gnome.desktop.interface font-name '@UI_FONT@ 11'
org.gnome.desktop.interface document-font-name '@UI_FONT@ 11'
org.gnome.desktop.wm.preferences titlebar-font '@UI_FONT@ Bold 11'
org.gnome.desktop.interface font-hinting 'slight'
org.gnome.desktop.interface font-antialiasing 'rgba'
