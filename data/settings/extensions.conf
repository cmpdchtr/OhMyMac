# OhMyMac — settings for extensions from the recommended/full profiles.
# Lines for extensions that are not installed are skipped automatically.

# Dash to Dock → macOS Dock
org.gnome.shell.extensions.dash-to-dock dock-position 'BOTTOM'
org.gnome.shell.extensions.dash-to-dock extend-height false
org.gnome.shell.extensions.dash-to-dock dock-fixed false
org.gnome.shell.extensions.dash-to-dock intellihide true
org.gnome.shell.extensions.dash-to-dock intellihide-mode 'ALL_WINDOWS'
org.gnome.shell.extensions.dash-to-dock dash-max-icon-size 56
org.gnome.shell.extensions.dash-to-dock icon-size-fixed true
org.gnome.shell.extensions.dash-to-dock show-apps-at-top true
org.gnome.shell.extensions.dash-to-dock show-trash true
org.gnome.shell.extensions.dash-to-dock show-mounts false
org.gnome.shell.extensions.dash-to-dock click-action 'minimize-or-previews'
org.gnome.shell.extensions.dash-to-dock scroll-action 'cycle-windows'
org.gnome.shell.extensions.dash-to-dock running-indicator-style 'DOTS'
org.gnome.shell.extensions.dash-to-dock apply-custom-theme false
org.gnome.shell.extensions.dash-to-dock custom-theme-shrink true
org.gnome.shell.extensions.dash-to-dock transparency-mode 'DEFAULT'
org.gnome.shell.extensions.dash-to-dock disable-overview-on-startup true
org.gnome.shell.extensions.dash-to-dock hot-keys false

# Liquid Glass → the Tahoe material. Glass for the dock, menus, Control
# Center, notifications and OSDs; the menu bar stays transparent like macOS.
org.gnome.shell.extensions.liquid-glass@thinkingcoding1231.gmail.com enable-dock-glass true
org.gnome.shell.extensions.liquid-glass@thinkingcoding1231.gmail.com enable-menu-glass true
org.gnome.shell.extensions.liquid-glass@thinkingcoding1231.gmail.com enable-quick-settings-glass true
org.gnome.shell.extensions.liquid-glass@thinkingcoding1231.gmail.com enable-notification-glass true
org.gnome.shell.extensions.liquid-glass@thinkingcoding1231.gmail.com enable-osd-glass true
org.gnome.shell.extensions.liquid-glass@thinkingcoding1231.gmail.com enable-panel-menu-animation true
org.gnome.shell.extensions.liquid-glass@thinkingcoding1231.gmail.com enable-quick-settings-animation true
org.gnome.shell.extensions.liquid-glass@thinkingcoding1231.gmail.com top-bar-style 'off'
org.gnome.shell.extensions.liquid-glass@thinkingcoding1231.gmail.com enable-glass-clock false
org.gnome.shell.extensions.liquid-glass@thinkingcoding1231.gmail.com enable-desktop-widgets false
org.gnome.shell.extensions.liquid-glass@thinkingcoding1231.gmail.com enable-application-glass false
org.gnome.shell.extensions.liquid-glass@thinkingcoding1231.gmail.com blur-my-shell-override true

# Spotlight: the Liquid Glass launcher on Super+Space (⌘Space). Keyboard layouts
# move to Ctrl+Space, which is what macOS uses for input sources.
org.gnome.shell.extensions.liquid-glass@thinkingcoding1231.gmail.com enable-launcher true
org.gnome.shell.extensions.liquid-glass@thinkingcoding1231.gmail.com launcher-shortcut ['<Super>space']
org.gnome.desktop.wm.keybindings switch-input-source ['<Control>space', 'XF86Keyboard']
org.gnome.desktop.wm.keybindings switch-input-source-backward ['<Shift><Control>space', '<Shift>XF86Keyboard']

# Blur my Shell → only the Launchpad/overview backdrop. The menu bar stays
# transparent and the dock is Liquid Glass, so those parts are off here.
org.gnome.shell.extensions.blur-my-shell.panel blur false
org.gnome.shell.extensions.blur-my-shell.dash-to-dock blur false
org.gnome.shell.extensions.blur-my-shell.overview blur true
org.gnome.shell.extensions.blur-my-shell.appfolder blur true
org.gnome.shell.extensions.blur-my-shell.applications blur false
