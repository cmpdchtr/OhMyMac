name: CI

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  lint:
    name: Lint & unit tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install tools
        run: sudo apt-get update -qq && sudo apt-get install -y --no-install-recommends shellcheck sassc libglib2.0-bin
      - name: shellcheck
        run: shellcheck -x install.sh uninstall.sh bin/ohmymac-sync lib/*.sh tests/*.sh
      - name: Extension syntax and schema
        run: |
          cp extensions/ohmymac@cmpdchtr.github.io/extension.js /tmp/extension.mjs
          node --check /tmp/extension.mjs
          glib-compile-schemas --strict --dry-run extensions/ohmymac@cmpdchtr.github.io/schemas
      - name: Test suite (sassc)
        run: bash tests/run.sh

  dart-sass:
    name: Build with Dart Sass
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm install --global sass@1
      - run: make build
      - uses: actions/upload-artifact@v4
        with:
          name: ohmymac-build
          path: build/

  gtk:
    name: Validate with GTK ${{ matrix.gtk }}
    needs: dart-sass
    runs-on: ubuntu-latest
    container: fedora:latest
    strategy:
      fail-fast: false
      matrix:
        gtk: ["3", "4"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          name: ohmymac-build
          path: build/
      - run: dnf install -y python3-gobject gtk3 gtk4 xorg-x11-server-Xvfb xorg-x11-xauth util-linux
      - name: Parse stylesheets
        run: |
          if [ "${{ matrix.gtk }}" = 3 ]; then
            files="build/OhMyMac-Light/gtk-3.0/gtk.css build/OhMyMac-Dark/gtk-3.0/gtk.css"
          else
            files="build/libadwaita/gtk.css build/OhMyMac-Light/gtk-4.0/gtk.css build/OhMyMac-Dark/gtk-4.0/gtk.css"
          fi
          xvfb-run -a python3 tests/validate-gtk.py ${{ matrix.gtk }} $files

  distros:
    name: Dry run on ${{ matrix.image }}
    runs-on: ubuntu-latest
    container: ${{ matrix.image }}
    strategy:
      fail-fast: false
      matrix:
        image:
          - ubuntu:24.04
          - debian:testing
          - fedora:latest
          - archlinux:latest
          - opensuse/tumbleweed:latest
          - alpine:latest
          - ghcr.io/void-linux/void-glibc-full:latest
    steps:
      - name: Install bash, git and tar
        run: |
          if command -v apk >/dev/null; then apk add --no-cache bash git tar coreutils grep sed findutils
          elif command -v xbps-install >/dev/null; then xbps-install -Syu xbps && xbps-install -y bash git tar
          elif command -v zypper >/dev/null; then zypper --non-interactive install git tar gzip
          elif command -v pacman >/dev/null; then pacman -Sy --noconfirm git
          elif command -v dnf >/dev/null; then dnf install -y git tar
          else apt-get update -qq && apt-get install -y git; fi
      - uses: actions/checkout@v4
      - name: Install dependencies (real package manager)
        run: OHM_ALLOW_ROOT=1 OHM_FORCE_GNOME=51.0 bash ./install.sh -y --themes-only --no-settings --dest /tmp/stage
      - name: Dry run of a full user install
        run: OHM_ALLOW_ROOT=1 OHM_FORCE_GNOME=51.0 bash ./install.sh --dry-run -y --no-deps --all
